# Development: Saritha Fashions backend in Docker with live reload.
#
#   docker compose -f docker-compose.dev.yml up --build     # start (first run downloads Maven dependencies)
#   docker compose -f docker-compose.dev.yml logs -f backend
#   docker compose -f docker-compose.dev.yml down            # stop
#
# API:   http://localhost:5000   (Swagger: http://localhost:5000/swagger-ui/index.html)
# Debug: attach a Java remote debugger to localhost:5005
#
# The app uses src/main/resources/application-dev.properties (profile "dev"), read from your mounted source.
# Any property can be overridden with an environment variable below, e.g. SPRING_DATA_MONGODB_URI.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: saritha-fashions-backend:dev
    container_name: saritha-backend-dev
    ports:
      - "5000:5000"   # app
      - "5005:5005"   # remote debugger
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PORT: "5000"
      TZ: Asia/Kolkata
      JAVA_OPTS: "-Xms256m -Xmx1g"
      # SPRING_DATA_MONGODB_URI: mongodb://host.docker.internal:27017/your-db   # a local MongoDB on your PC instead of Atlas
      # FRONTEND_WEBSITE_ALLOWED: http://localhost:5173/
    volumes:
      # your code: edits are picked up and recompiled inside the container
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml:ro
      # Maven downloads and build output stay inside Docker (not in your project folder)
      - maven-repo:/root/.m2
      - backend-target:/app/target
    restart: unless-stopped

volumes:
  maven-repo:
  backend-target:
