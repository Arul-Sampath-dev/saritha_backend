<!DOCTYPE html>
<!-- Tax invoice PDF. Model: v (formatted values), items (qty, name, price, total), blankRows (one entry per empty line), showCgstSgst, showIgst. -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title th:text="${'Invoice ' + v.invoiceNo}">Invoice</title>
  <style th:replace="~{layout :: styles}"></style>
</head>
<body>
  <div th:replace="~{layout :: footer}"></div>
  <div th:replace="~{layout :: header('TAX INVOICE', 'Invoice', ${v.invoiceNo}, ${v.invoiceDate})}"></div>
  <div th:replace="~{layout :: parties}"></div>

  <table class="grid">
    <thead>
      <tr><th style="width: 25%;">Payment method</th><th style="width: 25%;">Payment status</th>
          <th style="width: 25%;">HSN code</th><th style="width: 25%;">Expected delivery</th></tr>
    </thead>
    <tr>
      <td class="center" th:text="${v.paymentMethod}">Cash</td>
      <td class="center" th:text="${v.paymentStatus}">Paid</td>
      <td class="center" th:text="${v.hsnCode}">-</td>
      <td class="center" th:text="${v.expectedDelivery}">-</td>
    </tr>
  </table>

  <table class="grid" style="margin-bottom: 0;">
    <thead>
      <tr><th style="width: 12%;">Qty</th><th>Description</th>
          <th style="width: 18%;">Unit price (₹)</th><th style="width: 18%;">Line total (₹)</th></tr>
    </thead>
    <tr th:each="item : ${items}">
      <td class="center" th:text="${item.qty}">1</td>
      <td th:text="${item.name}">Blouse</td>
      <td class="num" th:text="${item.price}">0.00</td>
      <td class="num" th:text="${item.total}">0.00</td>
    </tr>
    <tr class="blank" th:each="i : ${blankRows}">
      <td>&#160;</td><td>&#160;</td><td>&#160;</td><td>&#160;</td>
    </tr>
  </table>

  <table class="totals">
    <colgroup><col /><col style="width: 18%;" /></colgroup>
    <th:block th:replace="~{layout :: gstRows}"></th:block>
    <tr><td class="label">Advance paid</td><td class="amount" th:text="${v.advancePaid}">0.00</td></tr>
    <tr class="strong"><td class="label">Balance due</td><td class="amount" th:text="${v.balanceDue}">0.00</td></tr>
  </table>

  <div class="notes">
    <div>Please bring this invoice on the due date.</div>
    <th:block th:replace="~{layout :: branches}"></th:block>
    <div class="thanks">THANK YOU FOR SHOPPING WITH US!</div>
  </div>
</body>
</html>
